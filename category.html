<!-- Load InsForge DB & gallery data scripts -->
<script src="js/insforge-db.js"></script>
<script src="js/gallery-data.js"></script>

<script>
/* ============ CATEGORY DEFINITIONS ============ */
function getActiveCategories() {
  const defaultList = [
    { key: 'toys', label: 'Toys & Educational Games', emoji: '🧸', desc: 'Remote control toys, soft toys, baby toys, board games & learning aids.' },
    { key: 'ballon', label: 'Balloons & Birthday Decor', emoji: '🎈', desc: 'Balloon bunches, decoration sets and party backdrops to light up any celebration.' },
    { key: 'chocolate', label: 'Chocolates', emoji: '🍫', desc: 'Popular chocolate brands and gift boxes, perfect for return gifts and celebrations.' },
    { key: 'chocolate2', label: 'Wafers & Party Treats', emoji: '🍬', desc: 'Assorted wafers, candies and snack treats for goodie bags and party trays.' },
    { key: 'prices', label: 'Price Stickers & Tags', emoji: '🏷️', desc: 'Bulk price stickers and tags for shops, boutiques and wholesale packaging.' },
    { key: 'stickers-cards', label: 'Greeting Cards & Stickers', emoji: '🎴', desc: 'Greeting cards, gift cards and decorative stickers for every festival and occasion.' }
  ];

  const map = new Map();
  defaultList.forEach(c => map.set(c.key, c));

  try {
    const stored = localStorage.getItem('sat_categories');
    if (stored) {
      const parsed = JSON.parse(stored);
      parsed.forEach(c => {
        const k = (c.id || c.key || '').toLowerCase();
        if (k) {
          map.set(k, {
            key: k,
            label: c.title || c.label || k,
            emoji: c.icon || c.emoji || '📦',
            desc: `Explore our high quality ${c.title || c.label || k} collection.`
          });
        }
      });
    }
  } catch (e) {}

  return Array.from(map.values());
}

/* ============ STATE MANAGEMENT ============ */
let currentCategoryKey = 'toys';
let categoryProducts = [];
let currentLbIndex = 0;

/* Dark mode handling */
const darkBtn = document.getElementById('darkToggle');
darkBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('sat_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
});

if (localStorage.getItem('sat_theme') === 'dark') {
  document.body.classList.add('dark');
}

/* Security & HTML Escaping helper */
function escapeHTML(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/* Fallback image helper */
window.imgFallback = function(img, title) {
  img.onerror = null;
  img.src = 'https://via.placeholder.com/400x300/f1f5f9/475569?text=' + encodeURIComponent(title || 'Product Photo');
};

/* Format product title */
function getProductTitle(item) {
  if (item.label && item.label !== item.cat && !item.label.includes('📦')) return item.label;
  if (item.src || item.path) {
    const rawName = (item.src || item.path).split('/').pop().replace(/\.[^/.]+$/, "");
    return rawName.replace(/^₹\d+\s*/i, '');
  }
  return 'Product Item';
}

/* Parse URL parameter */
function getUrlCategory() {
  const params = new URLSearchParams(window.location.search);
  const cat = params.get('cat');
  return cat ? cat.trim() : 'toys';
}

/* Match Category Info */
function getCatInfo(key) {
  const normKey = (key || '').toLowerCase().trim();
  const activeCategories = getActiveCategories();
  
  const found = activeCategories.find(c => c.key === normKey || normKey.includes(c.key) || c.key.includes(normKey));
  if (found) return found;

  // Keyword match fallbacks
  if (normKey.includes('toy') || normKey.includes('game')) return activeCategories[0];
  if (normKey.includes('ballon') || normKey.includes('decor')) return activeCategories[1];
  if (normKey.includes('chocolate') && !normKey.includes('2')) return activeCategories[2];
  if (normKey.includes('wafer') || normKey.includes('treat') || normKey.includes('chocolate2')) return activeCategories[3];
  if (normKey.includes('price') || normKey.includes('tag')) return activeCategories[4];
  if (normKey.includes('sticker') || normKey.includes('card')) return activeCategories[5];

  return { key: normKey, label: normKey.charAt(0).toUpperCase() + normKey.slice(1), emoji: '📦', desc: `Collection of items in ${normKey}.` };
}

/* Fetch Products for Category */
function fetchProductsForCategory(catKey) {
  let allItems = [];
  try {
    const storedProds = localStorage.getItem('sat_products');
    if (storedProds) {
      allItems = JSON.parse(storedProds);
    }
  } catch(e) {}

  if (!allItems || allItems.length === 0) {
    allItems = (typeof galleryData !== 'undefined' ? galleryData : []);
  }

  const catInfo = getCatInfo(catKey);
  const targetKey = catInfo.key.toLowerCase();

  return allItems.filter(item => {
    const cat = (item.cat || item.category || '').toLowerCase();
    if (targetKey === 'toys') return cat === 'toys';
    if (targetKey === 'ballon') return cat.includes('ballon');
    if (targetKey === 'chocolate') return cat === 'chocolate';
    if (targetKey === 'chocolate2') return cat === 'chocolate2';
    if (targetKey === 'prices') return cat === 'prices';
    if (targetKey === 'stickers-cards') return cat.includes('stickers') || cat.includes('cards');
    return cat === targetKey || cat.includes(targetKey) || targetKey.includes(cat);
  });
}

/* Render Category Pills Bar */
function renderPillsBar() {
  const container = document.getElementById('categoryPills');
  if (!container) return;
  container.innerHTML = '';

  const activeCategories = getActiveCategories();
  activeCategories.forEach(c => {
    const btn = document.createElement('button');
    btn.className = `pill-btn ${c.key === currentCategoryKey ? 'active' : ''}`;
    btn.innerHTML = `<span>${c.emoji}</span> <span>${c.label}</span>`;
    btn.onclick = () => switchCategory(c.key);
    container.appendChild(btn);
  });
}

/* Render Hero Banner */
function renderHero(catInfo, count) {
  document.title = `${catInfo.label} Photos | Sri Amman Toys & Chocolates Madurai`;
  document.getElementById('catEmoji').textContent = catInfo.emoji;
  document.getElementById('catTitle').textContent = catInfo.label;
  document.getElementById('catDesc').textContent = catInfo.desc || `Explore our high quality ${catInfo.label.toLowerCase()} collection.`;
  document.getElementById('catCountBadge').textContent = `${count} ${count === 1 ? 'Product Photo' : 'Product Photos'}`;
  
  const waBtn = document.getElementById('catEnquireBtn');
  waBtn.onclick = () => waEnquire(`Category: ${catInfo.label}`);
}

/* Render Product Grid */
function renderProductGrid(items) {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';

  if (!items || items.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📷</div>
        <h3>No Photos Available Yet</h3>
        <p>We are currently updating our digital catalog for this category. Contact us on WhatsApp for full catalogue & details!</p>
        <button class="btn btn-whatsapp" onclick="waEnquire('Product Catalogue Request')">Ask for Catalogue on WhatsApp</button>
      </div>
    `;
    return;
  }

  items.forEach((item, index) => {
    const imgSrc = item.src || item.path;
    const title = getProductTitle(item);
    const safeTitle = escapeHTML(title);
    const safeSrc = escapeHTML(imgSrc);
    
    const card = document.createElement('article');
    card.className = 'prod-card';
    card.style.cursor = 'pointer';
    card.onclick = () => openLightbox(index);
    card.innerHTML = `
      <div class="prod-img-box" style="height:260px;">
        <img src="${safeSrc}" alt="${safeTitle}" loading="lazy" onerror="imgFallback(this, '${safeTitle.replace(/'/g, "\\'")}')">
      </div>
    `;
    grid.appendChild(card);
  });
}

/* Switch Category */
function switchCategory(key) {
  currentCategoryKey = key;
  const url = new URL(window.location);
  url.searchParams.set('cat', key);
  window.history.pushState({}, '', url);

  const catInfo = getCatInfo(key);
  categoryProducts = fetchProductsForCategory(key);
  
  renderPillsBar();
  renderHero(catInfo, categoryProducts.length);
  renderProductGrid(categoryProducts);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* WhatsApp Enquiry Helper */
function waEnquire(productName) {
  const text = `Hello Sri Amman Toys! 👋\nI am interested in your ${productName}.\nCould you please share details and pricing?`;
  window.open(`https://wa.me/919245717267?text=${encodeURIComponent(text)}`, '_blank');
}

/* Download Photo Helper */
function downloadPhoto(src, filename) {
  const a = document.createElement('a');
  a.href = src;
  a.download = (filename || 'sri-amman-toys-product') + '.jpg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* Lightbox Modal Handling */
const lbModal = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbTitle = document.getElementById('lbTitle');
const lbCounter = document.getElementById('lbCounter');
const lbClose = document.getElementById('lbClose');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');
const lbSaveBtn = document.getElementById('lbSaveBtn');
const lbWABtn = document.getElementById('lbWABtn');

function openLightbox(index) {
  if (!categoryProducts[index]) return;
  currentLbIndex = index;
  updateLightbox();
  lbModal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateLightbox() {
  const item = categoryProducts[currentLbIndex];
  if (!item) return;
  const imgSrc = item.src || item.path;
  const title = getProductTitle(item);

  lbImg.src = imgSrc;
  lbTitle.textContent = title;
  lbCounter.textContent = `${currentLbIndex + 1} of ${categoryProducts.length}`;

  if (lbSaveBtn) lbSaveBtn.onclick = () => downloadPhoto(imgSrc, title);
  if (lbWABtn) lbWABtn.onclick = () => waEnquire(title);
}

function closeLightbox() {
  lbModal.classList.remove('open');
  document.body.style.overflow = '';
}

if (lbClose) lbClose.onclick = closeLightbox;
if (lbModal) lbModal.onclick = (e) => { if (e.target === lbModal) closeLightbox(); };

if (lbPrev) lbPrev.onclick = () => {
  if (categoryProducts.length === 0) return;
  currentLbIndex = (currentLbIndex - 1 + categoryProducts.length) % categoryProducts.length;
  updateLightbox();
};

if (lbNext) lbNext.onclick = () => {
  if (categoryProducts.length === 0) return;
  currentLbIndex = (currentLbIndex + 1) % categoryProducts.length;
  updateLightbox();
};

document.addEventListener('keydown', (e) => {
  if (!lbModal || !lbModal.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft' && lbPrev) lbPrev.click();
  if (e.key === 'ArrowRight' && lbNext) lbNext.click();
});

/* Initialize Page with InsForge Sync */
async function initCategoryPage() {
  currentCategoryKey = getUrlCategory();

  if (window.insforgeDB) {
    try {
      const remoteCats = await window.insforgeDB.getRecords('categories');
      if (remoteCats && remoteCats.length > 0) {
        const stored = JSON.parse(localStorage.getItem('sat_categories') || '[]');
        const catMap = new Map();
        stored.forEach(c => catMap.set(c.id, c));
        remoteCats.forEach(c => catMap.set(c.id, { id: c.id, title: c.title, icon: c.icon }));
        localStorage.setItem('sat_categories', JSON.stringify(Array.from(catMap.values())));
      }

      const remoteProds = await window.insforgeDB.getRecords('products');
      if (remoteProds && remoteProds.length > 0) {
        let storedProds = JSON.parse(localStorage.getItem('sat_products') || '[]');
        const prodKeys = new Set(storedProds.map(p => (p.label || '') + (p.src || '')));
        remoteProds.forEach(p => {
          const k = (p.label || '') + (p.src || '');
          if (!prodKeys.has(k)) {
            storedProds.unshift({ id: p.id, src: p.src, cat: p.cat, label: p.label, price: p.price });
            prodKeys.add(k);
          }
        });
        localStorage.setItem('sat_products', JSON.stringify(storedProds));
      }
    } catch(e) {
      console.log('InsForge fetch note:', e.message);
    }
  }

  const catInfo = getCatInfo(currentCategoryKey);
  categoryProducts = fetchProductsForCategory(currentCategoryKey);

  renderPillsBar();
  renderHero(catInfo, categoryProducts.length);
  renderProductGrid(categoryProducts);
}

document.addEventListener('DOMContentLoaded', initCategoryPage);

/* FSSAI LICENCE MODAL HELPERS */
function openFssaiModal() {
  const modal = document.getElementById('fssaiModal');
  const docViewer = document.getElementById('fssaiDocViewerCat');
  if (modal) {
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    if (docViewer) docViewer.scrollTop = 0;
  }
}

function closeFssaiModal() {
  const modal = document.getElementById('fssaiModal');
  if (modal) {
    modal.style.display = 'none';
    document.body.style.overflow = '';
  }
}

document.addEventListener('click', (e) => {
  const modal = document.getElementById('fssaiModal');
  if (modal && e.target === modal) {
    closeFssaiModal();
  }
});
</script>
